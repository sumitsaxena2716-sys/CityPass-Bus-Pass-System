{% extends 'base.html' %}{% block content %}<section class="error-section"><div
        class="error-art"><span class="error-code">{{ code }}</span><div
            class="error-route"
            aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div><div
        class="error-copy"><span class="eyebrow">A small detour</span><h1>{{
            'Page not found' if code == 404 else
            'We couldn’t complete that request' if code == 400 else
            'That request is too large' }}</h1><p>{{ message }}</p><div
            class="hero-actions"><a class="btn btn-primary"
                href="{{ url_for('home') }}">Back to home →</a><button
                class="btn btn-secondary history-back" type="button">Go
                back</button></div></div></section>{% endblock %}
